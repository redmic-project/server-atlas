services:
  atlas-view:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    environment:
      MICROSERVICE_NAME: ${UNIT_NAME}-view
      MICROSERVICE_PORT:
      SERVER_PORT: ${MICROSERVICE_PORT}
      OAUTH_CLIENT_ID:
      OAUTH_CLIENT_SECRET:
      ELASTIC_CLUSTERNAME:
      ELASTIC_USER:
      ELASTIC_PASSWORD:
      SPRING_KAFKA_CLIENT_ID:
      JAVA_OPTS:
    networks:
      elastic-net:
      metric-net:
      kafka-net:
      redmic-net:
      traefik-net:
    healthcheck:
      test: wget --spider -q http://localhost:${MICROSERVICE_PORT}/api/${UNIT_NAME}/view/actuator/health
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-15s}
      retries: ${HEALTHCHECK_RETRIES:-10}
      start_period: ${HEALTHCHECK_START_PERIOD:-3m}
    deploy:
      mode: replicated
      replicas: ${REPLICAS:-1}
      restart_policy:
        delay: ${TIME_SERIES_VIEW_RESTART_DELAY:-15s}
      update_config:
        delay: ${TIME_SERIES_VIEW_UPDATE_DELAY:-2m}
      labels:
        traefik.enable: ${TRAEFIK_ENABLE}
        traefik.http.routers.redmic-atlas-view.entrypoints: ${TRAEFIK_ENTRYPOINT}
        traefik.http.routers.redmic-atlas-view.rule: (Host(`${PUBLIC_HOSTNAME}`) || Host(`${TRAEFIK_SUBDOMAIN}.${PUBLIC_HOSTNAME}`)) && PathPrefix(`/api/${UNIT_NAME}/view`)
        traefik.http.services.redmic-atlas-view.loadbalancer.server.port: ${MICROSERVICE_PORT}

networks:
  elastic-net:
    name: ${ELASTIC_NET_NAME:-elastic6-net}
    driver: ${ELASTIC_NET_DRIVER:-overlay}
    external: true

  metric-net:
    name: ${METRIC_NET_NAME:-metric-net}
    driver: ${METRIC_NET_DRIVER:-overlay}
    external: true

  kafka-net:
    name: ${KAFKA_NET_NAME:-kafka-net}
    driver: ${KAFKA_NET_DRIVER:-overlay}
    external: true

  redmic-net:
    name: ${REDMIC_NET_NAME:-redmic-net}
    driver: ${REDMIC_NET_DRIVER:-overlay}
    external: true

  traefik-net:
    name: ${TRAEFIK_NET_NAME:-traefik-net}
    driver: ${TRAEFIK_NET_DRIVER:-overlay}
    external: true
